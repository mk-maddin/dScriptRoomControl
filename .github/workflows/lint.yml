name: dScript checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Static checks of the firmware sources
        run: python tools/dscript_lint.py dScriptRoomControl
      - name: Tests of the checker
        run: |
          pip install pytest
          pytest -v tests
